<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" role="img" aria-label="Robot IA procesando conversaciones">
  <defs>
    <linearGradient id="mBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee88a"/>
      <stop offset="0.55" stop-color="#25d366"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="mMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="mDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="mVisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="mEye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="mCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="0.6" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="mGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Halo de piso -->
  <ellipse cx="110" cy="264" rx="70" ry="13" fill="url(#mGlow)">
    <animate attributeName="rx" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Robot completo -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.6s" repeatCount="indefinite"/>

    <!-- Piernas -->
    <path d="M88 208c0-6 4-10 10-10s10 4 10 10v34c0 4-3 7-7 7h-6c-4 0-7-3-7-7Z" fill="url(#mDark)"/>
    <path d="M112 208c0-6 4-10 10-10s10 4 10 10v34c0 4-3 7-7 7h-6c-4 0-7-3-7-7Z" fill="url(#mDark)"/>
    <path d="M82 246h26a5 5 0 0 1 5 5v3H80a5 5 0 0 1-5-5c0-2 3-3 7-3Z" fill="url(#mBody)"/>
    <path d="M112 246h26c4 0 7 1 7 3a5 5 0 0 1-5 5h-33v-3a5 5 0 0 1 5-5Z" fill="url(#mBody)"/>

    <!-- Panel holográfico flotante frente al robot -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.8s" repeatCount="indefinite"/>
      <path d="M28 158l68 10v34l-68-6Z" fill="url(#mPanel)" stroke="#7dd3fc" stroke-width="1" opacity="0.9"/>
      <!-- Filas de "datos" -->
      <path d="M34 168l24 3M34 175l38 4M34 182l30 3M34 189l42 4" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <!-- Cursor parpadeante -->
      <rect x="78" y="190" width="4" height="6" fill="#e0f2fe">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Brazos: ambos hacia el panel (tecleando) -->
    <circle cx="80" cy="146" r="11" fill="url(#mMetal)"/>
    <circle cx="80" cy="146" r="5" fill="#38bdf8" opacity="0.85"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 80 146;3 80 146;0 80 146" dur="1.4s" repeatCount="indefinite"/>
      <rect x="48" y="146" width="40" height="12" rx="6" fill="url(#mBody)" transform="rotate(14 84 152)"/>
      <circle cx="52" cy="164" r="8" fill="url(#mMetal)"/>
    </g>
    <circle cx="140" cy="146" r="11" fill="url(#mMetal)"/>
    <circle cx="140" cy="146" r="5" fill="#38bdf8" opacity="0.85"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 140 146;-3 140 146;0 140 146" dur="1.4s" begin="0.35s" repeatCount="indefinite"/>
      <rect x="88" y="152" width="52" height="12" rx="6" fill="url(#mBody)" transform="rotate(22 140 152)"/>
      <circle cx="88" cy="176" r="8" fill="url(#mMetal)"/>
    </g>

    <!-- Torso -->
    <path d="M76 128c0-10 15-16 34-16s34 6 34 16l-4 58c-1 10-14 16-30 16s-29-6-30-16Z" fill="url(#mBody)"/>
    <path d="M86 132c0-6 10-10 24-10s24 4 24 10l-2.5 34c-.7 7-9.5 11-21.5 11s-20.8-4-21.5-11Z" fill="url(#mDark)"/>
    <!-- Núcleo: modo procesamiento (azul) -->
    <circle cx="110" cy="150" r="13" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.6" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" values="0 110 150;360 110 150" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="150" r="9" fill="url(#mCore)">
      <animate attributeName="r" values="9;10.5;9" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Chip IA en el núcleo -->
    <rect x="106" y="146" width="8" height="8" rx="1.5" fill="none" stroke="#0b1220" stroke-width="1.5"/>
    <path d="M108 143v3M112 143v3M108 154v3M112 154v3M103 148h3M103 152h3M114 148h3M114 152h3" stroke="#0b1220" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Cuello -->
    <rect x="101" y="100" width="18" height="14" rx="6" fill="url(#mMetal)"/>
    <rect x="98" y="108" width="24" height="5" rx="2.5" fill="#334155"/>

    <!-- Cabeza: inclinada hacia el panel -->
    <g transform="rotate(6 110 74)">
      <path d="M68 74c0-20 18-32 42-32s42 12 42 32v10c0 14-19 22-42 22s-42-8-42-22Z" fill="url(#mMetal)"/>
      <rect x="58" y="64" width="10" height="22" rx="5" fill="url(#mDark)"/>
      <rect x="152" y="64" width="10" height="22" rx="5" fill="url(#mDark)"/>
      <circle cx="63" cy="75" r="2.5" fill="#38bdf8"><animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="157" cy="75" r="2.5" fill="#38bdf8"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.9s" repeatCount="indefinite"/></circle>
      <path d="M76 70c0-10 14-16 34-16s34 6 34 16v6c0 9-14 15-34 15s-34-6-34-15Z" fill="url(#mVisor)"/>
      <!-- Ojos: modo concentrado (líneas) -->
      <rect x="90" y="67" width="14" height="4" rx="2" fill="url(#mEye)">
        <animate attributeName="width" values="14;10;14" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="114" y="67" width="14" height="4" rx="2" fill="url(#mEye)">
        <animate attributeName="width" values="14;10;14" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <!-- Línea de escaneo rápida (procesando) -->
      <rect x="78" y="62" width="64" height="1.5" fill="#7dd3fc" opacity="0.5">
        <animate attributeName="y" values="58;86;58" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <!-- Antena -->
      <rect x="107.5" y="28" width="5" height="16" rx="2.5" fill="#64748b"/>
      <circle cx="110" cy="24" r="6" fill="url(#mEye)">
        <animate attributeName="opacity" values="1;0.4;1" dur="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Hologramas de pensamiento: nodos neuronales sobre la cabeza -->
    <g opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.6s" repeatCount="indefinite"/>
      <path d="M148 40l14-8M162 32l14 6M162 32l2-14" stroke="#7dd3fc" stroke-width="1" opacity="0.5"/>
      <circle cx="148" cy="40" r="3" fill="#38bdf8"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="162" cy="32" r="4" fill="#7dd3fc"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="176" cy="38" r="2.5" fill="#38bdf8"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="164" cy="18" r="2.5" fill="#bae6fd"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.1s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>

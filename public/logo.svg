<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SoyAmoraDev">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34e27a"/>
      <stop offset="0.55" stop-color="#25d366"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#25d366"/>
    </radialGradient>
  </defs>

  <!-- Burbuja de chat (base) -->
  <path fill="url(#bg)" d="M32 4c15.5 0 26 9.8 26 24 0 14.3-10.5 24-26 24-2.6 0-5.1-.3-7.4-.8L13 58c-1.9 1.3-4.4-.4-3.9-2.6l1.8-7.6C7.4 43.6 6 36.3 6 28 6 13.8 16.5 4 32 4Z"/>

  <!-- Antena -->
  <rect x="30.6" y="9" width="2.8" height="6" rx="1.4" fill="#0b1220" opacity="0.85"/>
  <circle cx="32" cy="8" r="3.2" fill="url(#glow)"/>
  <circle cx="32" cy="8" r="4.8" fill="none" stroke="#a7f3d0" stroke-width="0.8" opacity="0.5"/>

  <!-- Cabeza del robot / visor -->
  <rect x="15" y="17" width="34" height="22" rx="10" fill="url(#visor)"/>
  <rect x="15.8" y="17.8" width="32.4" height="20.4" rx="9.2" fill="none" stroke="#5eead4" stroke-width="0.7" opacity="0.35"/>

  <!-- Ojos -->
  <rect x="22" y="24" width="7" height="8" rx="3.5" fill="url(#glow)">
    <animate attributeName="height" values="8;8;1.6;8;8" keyTimes="0;0.86;0.9;0.94;1" dur="4.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="24;24;27.2;24;24" keyTimes="0;0.86;0.9;0.94;1" dur="4.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="35" y="24" width="7" height="8" rx="3.5" fill="url(#glow)">
    <animate attributeName="height" values="8;8;1.6;8;8" keyTimes="0;0.86;0.9;0.94;1" dur="4.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="24;24;27.2;24;24" keyTimes="0;0.86;0.9;0.94;1" dur="4.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Boca: onda de señal -->
  <path d="M24 44.5h3.2l1.8-2.6 2.4 5 2.6-4.2 1.9 1.8H40" fill="none" stroke="#0b1220" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Orejas / módulos laterales -->
  <rect x="11" y="24" width="4" height="8" rx="2" fill="#0b1220" opacity="0.8"/>
  <rect x="49" y="24" width="4" height="8" rx="2" fill="#0b1220" opacity="0.8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Robot asistente de SoyAmoraDev presentando el sistema">
  <defs>
    <linearGradient id="mBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34e27a"/>
      <stop offset="0.6" stop-color="#25d366"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <linearGradient id="mFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="mDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="mEye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#10b981"/>
    </radialGradient>
    <radialGradient id="mGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25d366" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#25d366" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo de piso -->
  <ellipse cx="100" cy="246" rx="62" ry="12" fill="url(#mGlow)">
    <animate attributeName="rx" values="62;55;62" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Robot completo (flota) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.4s" repeatCount="indefinite"/>

    <!-- Piernas -->
    <rect x="80" y="196" width="14" height="38" rx="7" fill="url(#mDark)"/>
    <rect x="106" y="196" width="14" height="38" rx="7" fill="url(#mDark)"/>
    <rect x="74" y="228" width="26" height="10" rx="5" fill="#25d366"/>
    <rect x="100" y="228" width="26" height="10" rx="5" fill="#25d366"/>
    <!-- Rodillas -->
    <circle cx="87" cy="206" r="3" fill="#25d366" opacity="0.8"/>
    <circle cx="113" cy="206" r="3" fill="#25d366" opacity="0.8"/>

    <!-- Brazo derecho del robot (lado izq): extendido presentando -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 72 138;-4 72 138;0 72 138" dur="3.4s" repeatCount="indefinite"/>
      <rect x="24" y="130" width="52" height="13" rx="6.5" fill="url(#mBody)" transform="rotate(-18 76 137)"/>
      <!-- Mano abierta -->
      <circle cx="28" cy="122" r="8" fill="#e2e8f0"/>
      <!-- Chispa sobre la palma -->
      <g>
        <circle cx="28" cy="104" r="4" fill="#34e27a">
          <animate attributeName="cy" values="104;99;104" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <path d="M28 92v-6M20 95l-4-4M36 95l4-4" stroke="#34e27a" stroke-width="2" stroke-linecap="round" opacity="0.7">
          <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.2s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- Torso -->
    <rect x="66" y="122" width="68" height="82" rx="22" fill="url(#mBody)"/>
    <rect x="66.8" y="122.8" width="66.4" height="80.4" rx="21.2" fill="none" stroke="#a7f3d0" stroke-width="1" opacity="0.35"/>

    <!-- Pantalla en el pecho: burbuja de chat -->
    <rect x="78" y="136" width="44" height="34" rx="10" fill="url(#mDark)"/>
    <path d="M90 146h20a5 5 0 0 1 5 5v4a5 5 0 0 1-5 5h-9l-5 4v-4h-6a5 5 0 0 1-5-5v-4a5 5 0 0 1 5-5Z" fill="#25d366">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M93 153h14M93 157h9" stroke="#0b1220" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Luces del panel -->
    <circle cx="84" cy="178" r="2.2" fill="#34e27a"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="92" cy="178" r="2.2" fill="#a7f3d0"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="178" r="2.2" fill="#34e27a"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>

    <!-- Brazo izquierdo del robot (lado der): sostiene teléfono -->
    <rect x="128" y="130" width="13" height="46" rx="6.5" fill="url(#mBody)" transform="rotate(-8 134 132)"/>
    <circle cx="141" cy="176" r="7" fill="#e2e8f0"/>
    <!-- Teléfono -->
    <g transform="rotate(-6 148 160)">
      <rect x="140" y="142" width="20" height="36" rx="5" fill="url(#mDark)"/>
      <rect x="142.5" y="146" width="15" height="26" rx="2.5" fill="#16233d"/>
      <!-- Mensajes en pantalla -->
      <rect x="144.5" y="149" width="9" height="4" rx="2" fill="#25d366"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="148" y="156" width="8" height="4" rx="2" fill="#64748b"/>
      <rect x="144.5" y="163" width="10" height="4" rx="2" fill="#25d366"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></rect>
    </g>

    <!-- Cuello -->
    <rect x="93" y="108" width="14" height="14" rx="5" fill="#64748b"/>

    <!-- Cabeza -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 100 80;1.6 100 80;0 100 80;-1.2 100 80;0 100 80" dur="6s" repeatCount="indefinite"/>
      <rect x="62" y="46" width="76" height="62" rx="24" fill="url(#mFace)"/>
      <!-- Orejas -->
      <rect x="54" y="66" width="9" height="20" rx="4.5" fill="#25d366"/>
      <rect x="137" y="66" width="9" height="20" rx="4.5" fill="#25d366"/>
      <!-- Visor -->
      <rect x="72" y="60" width="56" height="32" rx="16" fill="url(#mDark)"/>
      <!-- Ojos -->
      <circle cx="89" cy="76" r="6" fill="url(#mEye)">
        <animate attributeName="r" values="6;6;1.2;6;6" keyTimes="0;0.88;0.92;0.96;1" dur="5.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="111" cy="76" r="6" fill="url(#mEye)">
        <animate attributeName="r" values="6;6;1.2;6;6" keyTimes="0;0.88;0.92;0.96;1" dur="5.4s" repeatCount="indefinite"/>
      </circle>
      <!-- Sonrisa en el visor -->
      <path d="M92 86c2.6 2.2 5.4 3.3 8 3.3s5.4-1.1 8-3.3" fill="none" stroke="#34e27a" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <!-- Antena -->
      <rect x="97.5" y="32" width="5" height="14" rx="2.5" fill="#64748b"/>
      <circle cx="100" cy="28" r="5.5" fill="url(#mEye)">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="28" r="9" fill="none" stroke="#a7f3d0" stroke-width="1" opacity="0.4">
        <animate attributeName="r" values="7;11" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>

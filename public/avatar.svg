<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Asistente SoyAmoraDev">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34e27a"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#10b981"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="32" cy="32" r="27"/>
    </clipPath>
  </defs>

  <!-- Anillo exterior -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="32" cy="32" r="27" fill="#0b1220"/>

  <g clip-path="url(#circle)">
    <!-- Torso -->
    <path d="M14 58c0-9 8-14 18-14s18 5 18 14v8H14Z" fill="url(#ring)"/>
    <path d="M26 45h12v5c0 3.3-2.7 6-6 6s-6-2.7-6-6Z" fill="#64748b"/>

    <!-- Cabeza -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="3.2s" repeatCount="indefinite"/>
      <rect x="16" y="14" width="32" height="28" rx="12" fill="url(#face)"/>
      <!-- Visor -->
      <rect x="20" y="20" width="24" height="14" rx="7" fill="#0b1220"/>
      <!-- Ojos -->
      <circle cx="27.5" cy="27" r="3" fill="url(#eye)">
        <animate attributeName="r" values="3;3;0.6;3;3" keyTimes="0;0.88;0.92;0.96;1" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="36.5" cy="27" r="3" fill="url(#eye)">
        <animate attributeName="r" values="3;3;0.6;3;3" keyTimes="0;0.88;0.92;0.96;1" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <!-- Sonrisa -->
      <path d="M27 37.5c1.6 1.6 3.4 2.4 5 2.4s3.4-.8 5-2.4" fill="none" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Diadema / headset -->
      <path d="M18 26c0-8 6-13 14-13s14 5 14 13" fill="none" stroke="#25d366" stroke-width="3" stroke-linecap="round"/>
      <rect x="14.5" y="23" width="5" height="9" rx="2.5" fill="#25d366"/>
      <rect x="44.5" y="23" width="5" height="9" rx="2.5" fill="#25d366"/>
      <!-- Micrófono -->
      <path d="M46 32c0 6-5 9-9 9" fill="none" stroke="#25d366" stroke-width="2" stroke-linecap="round"/>
      <circle cx="36" cy="41.5" r="2.4" fill="#34e27a"/>
    </g>
  </g>

  <!-- Punto de estado en línea -->
  <circle cx="51" cy="51" r="6" fill="#0b1220"/>
  <circle cx="51" cy="51" r="4" fill="#34e27a">
    <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
